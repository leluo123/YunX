# 同步上游 + 构建 APK（含腾讯微云补丁）
#
# 本仓库 = 上游 CYQawa/YunX + 腾讯微云补丁（12 个源码/资源文件 + tools/）。
#   1) sync   : 拉上游 master 正常合并进 master；真冲突时以上游为基线、回放我方补丁文件后 push
#   2) guard  : 构建前断言微云补丁仍在（补丁被吃掉就失败，不出残缺包）
#   3) build  : assembleRelease（有签名 Secrets 用正式证书，没有就现场自签名）
#   4) publish: 上传 Actions Artifacts + 发到 Releases（tag apk-v<版本>-wx）
#
# 与上游 build-apk.yml 的差异：上游只做 nightly 测试包、不发 Release、要求 4 个签名 Secrets；
# 本 fork 增加了上游同步、补丁守卫、自签名兜底与 Release 发布。
name: 同步上游并构建 APK（含微云）

on:
  # UTC 16:00 = 北京时间 00:00
  schedule:
    - cron: '0 16 * * *'
  # 支持在 Actions 页手动触发
  workflow_dispatch:

# 只上传 Artifacts，不写 Release/tag：读权限即可（最小权限原则）
permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要完整历史：同步上游要 merge，跳过构建的判断要读 origin/master
          fetch-depth: 0
          # push 回 master 需要凭据（permissions.contents: write）
          persist-credentials: true

      # 自动跟随上游：拉 CYQawa/YunX 的 master 合并进来，再 push 回本仓库。
      # 上游改到别处 → 正常合并；真冲突 → 以上游为基线 + 回放我方补丁文件。
      - name: 同步上游 master
        id: sync
        run: |
          set -eo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BEFORE="$(git rev-parse HEAD)"

          git remote add upstream https://github.com/CYQawa/YunX.git 2>/dev/null || true
          git fetch --no-tags upstream master

          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "upstream: no new commits"
            echo "synced=false" >> "$GITHUB_OUTPUT"
          else
            echo "upstream new commit: $(git log -1 --format='%h %s' FETCH_HEAD)"
            if ! git merge --no-edit FETCH_HEAD; then
              echo "::warning::merge conflict with upstream; re-applying our patch files on top of upstream"
              git merge --abort || true
              git reset --hard FETCH_HEAD
              # reset --hard 会删掉上游没有的文件，补丁清单必须完整（含 tools/ 与新增的 Weiyun*.kt）
              git checkout "$BEFORE" -- README.md README.upstream.md .github/workflows/build-apk.yml tools \
                app/src/main/kotlin/com/yunx/app/data/network/WeiyunApi.kt \
                app/src/main/kotlin/com/yunx/app/data/network/WeiyunConstants.kt \
                app/src/main/kotlin/com/yunx/app/data/repository/WeiyunResolveRepository.kt \
                app/src/main/kotlin/com/yunx/app/data/network/ShareLinkParser.kt \
                app/src/main/kotlin/com/yunx/app/data/download/DownloadPlatform.kt \
                app/src/main/kotlin/com/yunx/app/ui/items/PlatformLogos.kt \
                app/src/main/kotlin/com/yunx/app/ui/screens/ResolveScreen.kt \
                app/src/main/kotlin/com/yunx/app/ui/viewmodel/ResolveViewModel.kt \
                app/src/main/kotlin/com/yunx/app/ui/MainScreen.kt \
                app/src/main/res/values/strings.xml \
                app/src/main/res/values/strings_resolve.xml \
                app/src/main/res/drawable/logo_weiyun.png
              git add -A
              git commit -m "chore: sync upstream and re-apply our patch files" || true
            fi
            # 上游 README 原文备份（AGPL 要求保留原作者文档）
            git show FETCH_HEAD:README.md > README.upstream.md || true
            git add -A
            git commit -m "docs: refresh README.upstream.md from upstream" || true
            git push origin HEAD:master
            echo "synced=true" >> "$GITHUB_OUTPUT"
          fi

          echo "head=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # 上游重构可能让补丁"编译得过但功能没了"，构建前先断言微云注册点仍在
      - name: 校验微云补丁仍在
        run: |
          set -e
          fail() { echo "::error::$1"; exit 1; }
          test -f app/src/main/kotlin/com/yunx/app/data/repository/WeiyunResolveRepository.kt || fail "缺少 WeiyunResolveRepository.kt"
          test -f app/src/main/kotlin/com/yunx/app/data/network/WeiyunApi.kt || fail "缺少 WeiyunApi.kt"
          test -f app/src/main/res/drawable/logo_weiyun.png || fail "缺少 logo_weiyun.png"
          grep -q "WEIYUN(" app/src/main/kotlin/com/yunx/app/data/network/ShareLinkParser.kt || fail "ShareLinkParser 未注册 WEIYUN"
          grep -q "SharePlatform.WEIYUN -> weiyunResolveRepository" app/src/main/kotlin/com/yunx/app/ui/viewmodel/ResolveViewModel.kt || fail "ResolveViewModel 未分发 WEIYUN"
          echo "微云补丁校验通过"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 防重复：若 master 自上次成功构建以来没有新提交，则跳过本次 nightly，
      # 避免每天定时跑出完全相同的包。手动 workflow_dispatch 也会受此保护（无新提交即跳过）。
      - name: Skip if master has no new commit since last successful build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git fetch origin master --quiet
          HEAD_SHA=$(git rev-parse origin/master)
          echo "当前 master HEAD: $HEAD_SHA"

          # 最近一次本 workflow 成功 run 的 headSha（gh CLI 已预安装并带 GITHUB_TOKEN）
          # 按「文件名」而不是「工作流名称」查历史：改了 name 之后按名字查会一个都找不到，
          # gh 会以非零状态退出，配合 set -e 直接把这一步干掉。找不到时按「无记录」处理。
          LAST_SUCCESS=$(gh run list \
            --workflow build-apk.yml \
            --branch master \
            --status success \
            --limit 1 \
            --json headSha \
            --jq '.[0].headSha // ""' 2>/dev/null || echo "")
          echo "上次成功构建 SHA: ${LAST_SUCCESS:-（无）}"

          if [ -n "$LAST_SUCCESS" ] && [ "$LAST_SUCCESS" = "$HEAD_SHA" ]; then
            echo "::notice::master 自上次成功构建后无新提交，跳过本次 nightly"
            echo "SKIP_BUILD=1" >> "$GITHUB_ENV"
          fi

      # 从 Secrets 还原正式签名证书：KEYSTORE_BASE64 解码到 runner 临时目录
      # （不落仓库、不进 Artifacts，runner 销毁即消失）。四项 Secrets 缺一即报错退出，
      # 避免 nightly 悄悄产出未签名包（本地构建不经过这里 ⇒ release 仍是未签名包）。
      # 用 printf 而不是 echo 解码，防止个别 shell 对长字符串加换行/截断。
      - name: Restore or generate release keystore
        if: env.SKIP_BUILD != '1'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          KEYSTORE_FILE="$RUNNER_TEMP/yunx-release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            # 仓库配了正式证书：优先用它（与官方包同签名，可直接覆盖安装）
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
            echo "YUNX_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "YUNX_KEY_ALIAS=$KEY_ALIAS"               >> "$GITHUB_ENV"
            echo "YUNX_KEY_PASSWORD=$KEY_PASSWORD"         >> "$GITHUB_ENV"
            echo "::notice::使用仓库 Secrets 里的正式证书签名（别名 $KEY_ALIAS）"
          else
            # 没有 Secrets（本 fork 默认状态）：现场生成一次性自签名证书。
            # APK 可直接安装；每次构建签名不同 ⇒ 跨构建升级需先卸载旧版。
            keytool -genkeypair -v -keystore "$KEYSTORE_FILE" -alias yunx-wx \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass yunxweiyun -keypass yunxweiyun \
              -dname "CN=YunX Weiyun Build, O=leluo123, C=CN" > /dev/null
            echo "YUNX_KEYSTORE_PASSWORD=yunxweiyun" >> "$GITHUB_ENV"
            echo "YUNX_KEY_ALIAS=yunx-wx"           >> "$GITHUB_ENV"
            echo "YUNX_KEY_PASSWORD=yunxweiyun"     >> "$GITHUB_ENV"
            echo "::notice::未配置签名 Secrets，已生成临时自签名证书"
          fi
          keytool -list -keystore "$KEYSTORE_FILE" -storepass "${YUNX_KEYSTORE_PASSWORD:-yunxweiyun}" > /dev/null
          echo "YUNX_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Build release APK
        if: env.SKIP_BUILD != '1'
        # 项目 settings.gradle.kts 按 YUNX_USE_MIRROR 切换仓库：CI 上阿里云镜像不可达，必须走官方源。
        # runner 镜像预装 Android SDK（licenses 已接受），AGP 会自动补装缺失的 SDK 组件。
        # release 变体开启 R8 混淆 + 资源压缩，产物显著小于 debug。
        # 签名口令/别名只注入到这一步；证书路径 YUNX_KEYSTORE_FILE 已由上一步写进 GITHUB_ENV。
        env:
          YUNX_USE_MIRROR: 'false'
          # 证书路径与口令由上一步写进 GITHUB_ENV（正式证书或现场自签名走同一条路）
        run: |
          ./gradlew assembleRelease --no-daemon

      # 自检：产物必须存在且真的带上正式证书（apksigner 随 runner 预装的 build-tools 提供）。
      # 有这一步，签名配置写错（变量名打错、证书没生效）会在 CI 里立刻红，而不是发出一堆装不上的包。
      - name: Verify signed APK
        if: env.SKIP_BUILD != '1'
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::未找到已签名产物 $APK —— release 签名配置未生效？"
            exit 1
          fi
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(ls "$SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | head -6

      # 产物只上传为 Actions Artifacts，命名按作者要求：YunX-nightly-<日期>-<短SHA>。
      # 日期/短SHA 先在 shell 里算出来写进 GITHUB_ENV，再在 upload-artifact 的 name 里引用
      # （name 字段不做 shell 展开，直接写 $() 在 Actions 里不会生效）。
      - name: Resolve artifact name (date-shortSHA)
        if: env.SKIP_BUILD != '1'
        run: |
          echo "ARTIFACT_NAME=YunX-nightly-$(date +%Y%m%d)-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Upload APK as artifact
        if: env.SKIP_BUILD != '1'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # 本 fork 额外把 APK 发成 Release：不用登录 Actions 就能直接下载安装
      - name: Publish APK to Release
        if: env.SKIP_BUILD != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          TAG="apk-v${VER}-wx"
          cp app/build/outputs/apk/release/app-release.apk "YunX-${VER}-wx.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "YunX-${VER}-wx.apk" --clobber
          else
            gh release create "$TAG" "YunX-${VER}-wx.apk" \
              --title "云析 YunX ${VER} · Android 版（含腾讯微云）" \
              --notes "本包由 leluo123/YunX 自动构建，在上游 ${VER} 基础上增加腾讯微云分享解析（免登录，支持目录浏览与续传下载）。代码版权归原作者 CYQawa，AGPL-3.0。若覆盖安装失败请先卸载旧版（自签名证书随构建变化）。"
          fi
